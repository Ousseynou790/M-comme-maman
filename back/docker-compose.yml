# PostgreSQL de développement.
#
#   docker compose up -d
#
# Les données survivent aux redémarrages grâce au volume nommé. Pour repartir
# d'une base vierge : docker compose down -v
services:
  db:
    image: postgres:17-alpine
    container_name: mcm-postgres
    environment:
      POSTGRES_DB: mcm
      POSTGRES_USER: mcm
      POSTGRES_PASSWORD: mcm
    ports:
      - "5432:5432"
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcm -d mcm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  donnees:
